  <style>
    :root {
      color-scheme: light;
      --blue: #172fe5;
      --orange: #ff5b0a;
      --ink: #10204b;
      --mist: #f6f8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--mist);
      font-family: Georgia, 'Times New Roman', serif;
    }

    #app-loader {
      align-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .96) 0, rgba(255, 255, 255, .72) 28%, transparent 58%),
        linear-gradient(135deg, #eef1ff 0%, #fff8f3 52%, #f5f7ff 100%);
      display: flex;
      inset: 0;
      justify-content: center;
      opacity: 1;
      overflow: hidden;
      position: fixed;
      transition: opacity .55s ease, visibility .55s ease;
      visibility: visible;
      z-index: 9999;
    }

    #app-loader::before,
    #app-loader::after {
      border: 1px solid rgba(23, 47, 229, .1);
      border-radius: 50%;
      content: '';
      height: min(82vw, 540px);
      position: absolute;
      width: min(82vw, 540px);
    }

    #app-loader::after {
      border-color: rgba(255, 91, 10, .13);
      height: min(105vw, 700px);
      width: min(105vw, 700px);
    }

    #app-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .loader-content {
      align-items: center;
      display: flex;
      flex-direction: column;
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .loader-logo {
      animation: logo-in .8s cubic-bezier(.2, .8, .2, 1) both;
      filter: drop-shadow(0 16px 22px rgba(16, 32, 75, .14));
      height: clamp(150px, 27vw, 250px);
      object-fit: contain;
      width: clamp(150px, 27vw, 250px);
    }

    .loader-title {
      color: var(--ink);
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: .02em;
      margin: 18px 0 5px;
    }

    .loader-subtitle {
      color: #65708d;
      font-family: Arial, sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .2em;
      margin: 0 0 25px;
      text-transform: uppercase;
    }

    .loader-track {
      background: rgba(23, 47, 229, .13);
      border-radius: 10px;
      height: 4px;
      overflow: hidden;
      width: min(180px, 48vw);
    }

    .loader-progress {
      animation: loading 1.45s ease-in-out infinite;
      background: linear-gradient(90deg, var(--blue), var(--orange));
      border-radius: inherit;
      height: 100%;
      transform: translateX(-100%);
      width: 100%;
    }

    @keyframes logo-in {
      from { opacity: 0; transform: translateY(12px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      55%, 100% { transform: translateX(100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-logo,
      .loader-progress { animation: none; }
      .loader-progress { transform: translateX(0); }
    }
  </style>

<body>
  <div id="app-loader" role="status" aria-live="polite" aria-label="Loading Mulongo Driving School">
    <div class="loader-content">
      <img class="loader-logo" src="icons/logo.png" alt="Mulongo Driving School logo">
      <p class="loader-title">Mulongo Driving School</p>
      <p class="loader-subtitle">Your partner in professional driving</p>
      <div class="loader-track" aria-hidden="true">
        <div class="loader-progress"></div>
      </div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var loader = document.getElementById('app-loader');
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view, canvas')) {
          loader.classList.add('is-hidden');
          observer.disconnect();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
